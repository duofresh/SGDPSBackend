name: Sync Data Files

on:
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download data.zip from app
        env:
          JWT: ${{ secrets.OWNER_JWT }}
        run: |
          curl -H "Authorization: Bearer $JWT" https://sgdpsbackend.onrender.com/api/download-data -o data.zip
          rm -rf data
          unzip data.zip -d data

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Sync data files from deployment" || echo "No changes to commit"
          git push
